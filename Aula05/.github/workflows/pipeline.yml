name: Pipeline CI/CD
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ==========================================
  # 1. BUILD
  # ==========================================

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Verificar arquivos
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

          echo "Build concluído com sucesso!"


  # ==========================================
  # 2. TEST
  # ==========================================

  test:
    name: Test
    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Executar testes
        run: npm test


  # ==========================================
  # 3. QUALITY
  # ==========================================

  quality:
    name: Quality
    runs-on: ubuntu-latest

    needs: test

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Executar análise de qualidade
        run: npm run lint


  # ==========================================
  # 4. SECURITY
  # ==========================================

  security:
    name: Security
    runs-on: ubuntu-latest

    needs: quality

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Verificar vulnerabilidades
        run: npm audit --audit-level=high


  # ==========================================
  # 5. PACKAGE
  # ==========================================

  package:
    name: Package
    runs-on: ubuntu-latest

    needs: security

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Criar pacote
        run: |
          mkdir -p dist

          cp index.html dist/
          cp style.css dist/
          cp script.js dist/

          echo "Pacote criado com sucesso!"

      - name: Verificar pacote
        run: |
          test -f dist/index.html
          test -f dist/style.css
          test -f dist/script.js

      - name: Publicar artefato da aplicacao
        uses: actions/upload-artifact@v4
        with:
          name: gerador-de-frases-${{ github.sha }}
          path: dist/
          if-no-files-found: error


  # ==========================================
  # 6. DEPLOY
  # ==========================================

  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    needs: package

    steps:

      - name: Deploy em desenvolvimento
        run: |
          echo "Realizando deploy no ambiente DEV..."
          echo "Deploy DEV concluído!"


  # ==========================================
  # 7. SMOKE TEST
  # ==========================================

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest

    needs: deploy

    steps:

      - name: Executar Smoke Test
        run: |
          echo "Verificando aplicação..."
          echo "Aplicação está funcionando!"
          echo "Smoke Test aprovado!"


  # ==========================================
  # 8. PERFORMANCE
  # ==========================================

  performance:
    name: Performance
    runs-on: ubuntu-latest

    needs: smoke-test

    steps:

      - name: Executar teste de performance
        run: |
          echo "Executando teste de performance..."
          echo "Performance aprovada!"


  # ==========================================
  # 9. APPROVAL
  # ==========================================

  approval:
    name: Approval
    runs-on: ubuntu-latest

    needs: performance

    steps:

      - name: Aprovação para produção
        run: |
          echo "Aplicação aprovada para produção!"


  # ==========================================
  # 10. RELEASE
  # ==========================================

  release:
    name: Release
    runs-on: ubuntu-latest

    needs: approval

    steps:

      - name: Criar release
        run: |
          echo "Criando nova versão..."
          echo "Release criada com sucesso!"


  # ==========================================
  # 11. MONITORING
  # ==========================================

  monitoring:
    name: Monitoring
    runs-on: ubuntu-latest

    needs: release

    steps:

      - name: Monitorar aplicação
        run: |
          echo "Monitorando aplicação..."
          echo "Aplicação funcionando normalmente!"


  # ==========================================
  # 12. ROLLBACK
  # ==========================================

  rollback:
    name: Rollback
    runs-on: ubuntu-latest

    needs: monitoring

    if: failure()

    steps:

      - name: Executar rollback
        run: |
          echo "Problema detectado!"
          echo "Executando rollback..."
          echo "Rollback concluído!"