name: Pipeline CI/CD - Aula 05

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Aula05
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Aula05/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar arquivos da aplicacao
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

  test:
    name: Testes
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: Aula05
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Aula05/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Executar testes
        run: npm test -- --runInBand

      - name: Executar lint
        run: npm run lint

      - name: Verificar vulnerabilidades
        run: npm audit --audit-level=high

      - name: Criar pacote
        run: |
          mkdir -p dist
          cp index.html dist/
          cp style.css dist/
          cp script.js dist/

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: aula05-gerador-de-frases-${{ github.sha }}
          path: Aula05/dist/
          if-no-files-found: error